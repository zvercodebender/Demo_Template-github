###
### A properties files is typically used for local testing only
### https://docs.liquibase.com/concepts/connections/creating-config-properties.html
###

###
### Connectivity
###
# Update the url below for your database
# SQL Server:  jdbc:sqlserver://hostname:1433;databaseName=dbname;trustServerCertificate=true
# PostgreSQL:  jdbc:postgresql://hostname:5432/dbname
# Oracle:      jdbc:oracle:thin:@hostname:1521:SID
# MySQL:       jdbc:mysql://hostname:3306/dbname
# MongoDB:     mongodb://hostname:27017/dbname
# url: jdbc:sqlserver://hostname:1433;databaseName=databaseName;trustServerCertificate=true
# username: db_user
# password: db_password
###
### Root Changelog/Search Path
###
changelogFile: changelog.main.xml
# Mac/Linux
# liquibase.searchPath: /path/to/extracted/folder
# Windows
liquibase.searchPath: .
###
### Policy Check Options
### https://docs.liquibase.com/liquibase-pro/policy-checks/home.html
###
liquibase.command.checksOutput: issues
liquibase.command.checksScope: changelog
liquibase.command.checksScriptsEnabled: true
liquibase.command.checks.run.changesetFilter: pending
# Pull checks from the Governance assignment on the Liquibase Secure server
# instead of liquibase.checks-settings.conf
liquibase.command.checks.run.assignmentId: ebea64ed-e973-43f6-a3f4-fc3e568185e1
liquibase.command.checks.show.assignmentId: ebea64ed-e973-43f6-a3f4-fc3e568185e1
###
### Misc. Options
###
liquibase.dbclhistory.enabled: true
liquibase.reports.enabled: true
liquibase.reports.open: true
liquibase.showBanner: false
liquibase.reports.path=reports/
###
### Secure key
###
liquibase.insights.enabled=true
# 6.0+: base URL, not the ingest endpoint. Must include /api - the demo server's
# Cloudflare Access gateway only lets /api/* through without an SSO login.
liquibase.insights.apiUrl=https://insights-demo.liquibase.net/api
#liquibase.insights.authToken=<YOUR_INSIGHTS_AUTH_TOKEN>
liquibase.insights.connectionIdentifier=rrb-pgdemo-inhouse
