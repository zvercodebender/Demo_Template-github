  - changeSet:
      comment: Release 1.0.2
      id: sp_create_getemployeesbyorg
      author: molivas
      labels: release-1.0.2
      splitStatements: false
      runOnChange: true
      changes:
        - sql:
            sql: |
              CREATE OR REPLACE FUNCTION get_employees_by_org(p_org_id integer)
              RETURNS TABLE (
                  ID integer,
                  FIRST_NAME varchar,
                  LAST_NAME varchar,
                  DATE_OF_BIRTH date
              ) AS $$
              BEGIN
                  RETURN QUERY
                  SELECT e.ID, e.FIRST_NAME, e.LAST_NAME, e.DATE_OF_BIRTH
                  FROM EMPLOYEES e
                  WHERE e.ORG_ID = p_org_id;
              END;
              $$ LANGUAGE plpgsql;
      rollback:
        - sql:
            sql: DROP FUNCTION IF EXISTS get_employees_by_org(integer)

